{{- if .Values.dbCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dbCredentials.secretName }}
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  username: {{ .Values.dbCredentials.username | quote }}
  password: {{ .Values.dbCredentials.password | quote }}
{{- end }}
