{{- $be := .Values.backend }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ .Values.namespace.name }}
data:
  {{- range $k, $v := $be.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace.name }}
  labels:
    app: backend
spec:
  replicas: {{ $be.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      containers:
        - name: classes-api
          image: {{ $be.image.repository }}:{{ $be.image.tag }}
          imagePullPolicy: {{ $be.image.pullPolicy }}
          ports:
            - containerPort: {{ $be.port }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- range $k, $_ := $be.config }}
            - name: {{ $k }}
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: {{ $k }}
            {{- end }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbCredentials.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbCredentials.secretName }}
                  key: password
          readinessProbe:
            {{- toYaml $be.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $be.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml $be.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace.name }}
spec:
  selector:
    app: backend
  ports:
    - port: {{ $be.port }}
      targetPort: {{ $be.port }}
